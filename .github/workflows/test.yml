name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
      - run: node --check docs/scan-activity.js
      - run: node --test tests/scan-activity-ui.test.mjs
      - run: node --test tests/dashboard-ui.test.mjs
      - run: python -m compileall -q app scripts
