name: Scan and publish tracker

on:
  schedule:
    # Lightweight watchlist refresh only. Broad discovery follows completion.
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
    inputs:
      crawl_section:
        description: "all = scan and publish each section in turn; rotate = one section only"
        type: choice
        default: all
        options:
          - rotate
          - all
          - gaming
          - home
          - lifestyle
          - general
      auto_continue:
        description: "Chain the next section automatically after this run? (automated dispatches use true)"
        type: boolean
        default: false
  push:
    branches: [main]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

permissions:
  contents: read
  issues: write
  actions: read
  pages: write
  id-token: write

# Automatic discovery dispatches are queued before the current workflow
# releases its lock. queue:max prevents GitHub cancelling an older pending
# bestseller scan when another run is requested. Watchlist-only checks remain
# independent and continue even while bestseller discovery is running.
concurrency:
  group: tracker-${{ (github.event_name == 'issues' || github.event_name == 'schedule') && 'watchlist' || 'main' }}
  cancel-in-progress: false
  queue: max

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  watchlist:
    # Chain-triggered bestseller runs do not repeat the 10-minute watchlist.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_continue != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Prevent concurrent runs from racing on watchlist price history.
    concurrency:
      group: tracker-watchlist-scan
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore watchlist history
        uses: actions/cache@v6
        with:
          path: data/tracker.db
          key: tracker-db-v1-${{ github.run_id }}
          restore-keys: |
            tracker-db-v1-

      - name: Fetch the published snapshot
        run: |
          mkdir -p site
          curl -fsSL "$PAGES_URL/data.json?t=$(date +%s)" -o site/previous-data.json \
            || cp docs/data.json site/previous-data.json

      - name: Scan watchlist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_DELAY_SECONDS: "2"
        run: |
          python -m scripts.scan \
            --watchlist watchlist.json \
            --previous site/previous-data.json \
            --output site/data.json

      - name: Stage watchlist artifact
        run: cp site/data.json watchlist-data.json

      - uses: actions/upload-artifact@v7
        with:
          name: watchlist-data
          path: watchlist-data.json
          retention-days: 1

  publish-watchlist:
    needs: watchlist
    if: ${{ needs.watchlist.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: watchlist-data
          path: incoming

      - name: Assemble site after watchlist scan
        run: |
          mkdir -p docs
          curl -fsSL "$PAGES_URL/data.json?t=$(date +%s)" -o docs/data.previous.json || echo '{}' > docs/data.previous.json
          python3 -m scripts.publish_watchlist --previous docs/data.previous.json --incoming incoming/watchlist-data.json --output docs/data.json
          rm docs/data.previous.json
          curl -fsSL "$PAGES_URL/deals.json?t=$(date +%s)" -o docs/deals.json || true
          test -s docs/deals.json || echo '{}' > docs/deals.json
          curl -fsSL "$PAGES_URL/hotlist.json?t=$(date +%s)" -o docs/hotlist.json || echo '{}' > docs/hotlist.json
          curl -fsSL "$PAGES_URL/catalogue.json?t=$(date +%s)" -o docs/catalogue.json || echo '{"sections":{}}' > docs/catalogue.json
          curl -fsSL "$PAGES_URL/catalogue.csv?t=$(date +%s)" -o docs/catalogue.csv || printf 'section,asin,title,url,category,rank,price_eur\n' > docs/catalogue.csv
          ls -la docs

      - id: deployment
        uses: ./.github/actions/deploy-tracker-site
        with:
          artifact_name: pages-watchlist-${{ github.run_attempt }}

  bestsellers:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.crawl_section != 'all'
      ) ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore bestseller price history
        uses: actions/cache@v6
        with:
          path: data/bestsellers.db
          key: bestsellers-db-v1-${{ github.run_id }}
          restore-keys: |
            bestsellers-db-v1-

      - name: Choose bestseller section
        id: crawl-section
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.crawl_section }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=rotate" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch published deals and complete listing catalogue
        run: |
          mkdir -p site
          curl -fsSL "$PAGES_URL/deals.json?t=$(date +%s)" -o site/previous-deals.json || echo '{}' > site/previous-deals.json
          curl -fsSL "$PAGES_URL/catalogue.json?t=$(date +%s)" -o site/previous-catalogue.json || echo '{}' > site/previous-catalogue.json

      - name: Crawl bestseller section
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python -m scripts.crawl_bestsellers \
            --config bestsellers.json \
            --section "${{ steps.crawl-section.outputs.id }}" \
            --run-number "${{ github.run_number }}" \
            --merge-previous site/previous-deals.json \
            --previous-catalogue site/previous-catalogue.json \
            --catalogue-output site/catalogue.fragment.json \
            --publish-fragment \
            --output site/deals.json

      - name: Stage section results and Actions summary
        run: |
          cp site/deals.json bestsellers-data.json
          cp site/catalogue.fragment.json catalogue-fragment.json
          python -m scripts.scan_summary --input bestsellers-data.json --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: bestsellers-data
          path: |
            bestsellers-data.json
            catalogue-fragment.json
          retention-days: 1

  publish-bestsellers:
    needs: bestsellers
    if: ${{ needs.bestsellers.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The Python merge command imports app.config, which requires installed dependencies.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: bestsellers-data
          path: incoming

      - name: Assemble site after bestseller scan
        run: |
          mkdir -p docs
          curl -fsSL "$PAGES_URL/deals.json?t=$(date +%s)" -o docs/deals.previous.json || echo '{}' > docs/deals.previous.json
          python -m scripts.merge_deals --previous docs/deals.previous.json --incoming incoming/bestsellers-data.json --output docs/deals.json
          rm docs/deals.previous.json
          curl -fsSL "$PAGES_URL/catalogue.json?t=$(date +%s)" -o docs/catalogue.previous.json || echo '{}' > docs/catalogue.previous.json
          python -m scripts.merge_catalogue --previous docs/catalogue.previous.json --incoming incoming/catalogue-fragment.json --output docs/catalogue.json --csv docs/catalogue.csv
          rm docs/catalogue.previous.json
          curl -fsSL "$PAGES_URL/data.json?t=$(date +%s)" -o docs/data.json.new \
            && mv docs/data.json.new docs/data.json || true
          curl -fsSL "$PAGES_URL/hotlist.json?t=$(date +%s)" -o docs/hotlist.json || echo '{}' > docs/hotlist.json
          ls -la docs

      - id: deployment
        uses: ./.github/actions/deploy-tracker-site
        with:
          artifact_name: pages-bestsellers-${{ github.run_attempt }}
      - name: Published section summary
        run: python -m scripts.scan_summary --input docs/deals.json --summary "$GITHUB_STEP_SUMMARY" --published

  queue-next-bestseller:
    name: Queue next section after publishing
    needs: [bestsellers, publish-bestsellers, watchlist, publish-watchlist]
    # No chain after manually selecting 'all' (the four-section matrix has
    # its own publishing flow), or after an unsuccessful publication.
    if: >-
      always() &&
      needs.publish-bestsellers.result == 'success' &&
      !github.event.repository.private &&
      vars.PAUSE_AUTOMATIC_SCAN != 'true' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.auto_continue == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue next rotating section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # workflow_dispatch events created by GITHUB_TOKEN are explicitly
          # allowed to trigger new GitHub Actions runs. This new run waits
          # behind this workflow's tracker-main concurrency lock.
          gh workflow run pages.yml --repo "$GH_REPO" --ref main \
            -f crawl_section=rotate \
            -f auto_continue=true
          echo "Next section queued after successful publishing." >> "$GITHUB_STEP_SUMMARY"

  bestsellers-all:
    name: Scan and publish ${{ matrix.section }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.crawl_section == 'all'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        section: [gaming, home, lifestyle, general]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore bestseller price history
        uses: actions/cache@v6
        with:
          path: data/bestsellers.db
          # Matrix jobs must write distinct caches or only the first section is saved.
          key: bestsellers-db-v1-${{ github.run_id }}-${{ matrix.section }}
          restore-keys: |
            bestsellers-db-v1-

      - name: Fetch published deals and complete listing catalogue
        run: |
          mkdir -p site
          curl -fsSL "$PAGES_URL/deals.json?t=$(date +%s)" -o site/previous-deals.json || echo '{}' > site/previous-deals.json
          curl -fsSL "$PAGES_URL/catalogue.json?t=$(date +%s)" -o site/previous-catalogue.json || echo '{}' > site/previous-catalogue.json

      - name: Crawl section and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: |
          EXTRA=""
          if [ "${{ matrix.section }}" != "general" ]; then
            EXTRA="--skip-health"
          fi
          python -m scripts.crawl_bestsellers \
            --config bestsellers.json \
            --section "${{ matrix.section }}" \
            --merge-previous site/previous-deals.json \
            --previous-catalogue site/previous-catalogue.json \
            --catalogue-output site/catalogue.fragment.json \
            --publish-fragment \
            --output site/deals.json \
            $EXTRA

      - name: Section scan summary (before publishing)
        run: python -m scripts.scan_summary --input site/deals.json --summary "$GITHUB_STEP_SUMMARY"

      # Incoming is one section only; merge with current published data here,
      # immediately before deploying this block, to preserve other sections.
      - name: Assemble and merge section immediately before publish
        run: |
          curl -fsSL "$PAGES_URL/deals.json?t=$(date +%s)" -o docs/deals.previous.json || echo '{}' > docs/deals.previous.json
          python -m scripts.merge_deals --previous docs/deals.previous.json --incoming site/deals.json --output docs/deals.json
          rm docs/deals.previous.json
          curl -fsSL "$PAGES_URL/catalogue.json?t=$(date +%s)" -o docs/catalogue.previous.json || echo '{}' > docs/catalogue.previous.json
          python -m scripts.merge_catalogue --previous docs/catalogue.previous.json --incoming site/catalogue.fragment.json --output docs/catalogue.json --csv docs/catalogue.csv
          rm docs/catalogue.previous.json
          curl -fsSL "$PAGES_URL/data.json?t=$(date +%s)" -o docs/data.json || true
          curl -fsSL "$PAGES_URL/hotlist.json?t=$(date +%s)" -o docs/hotlist.json || echo '{}' > docs/hotlist.json
          ls -la docs

      - id: deployment
        uses: ./.github/actions/deploy-tracker-site
        with:
          artifact_name: pages-all-${{ matrix.section }}-${{ github.run_attempt }}
      - name: Report completed section
        run: python -m scripts.scan_summary --input docs/deals.json --summary "$GITHUB_STEP_SUMMARY" --published
