name: Scan and publish tracker

on:
  schedule:
    # GitHub cron is often delayed a few minutes; this is as close as Pages can get to "immediate".
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/scaffold-price-error-tracker-61ca
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages-tracker
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/tracker.db
          key: tracker-db-v1-${{ github.run_id }}
          restore-keys: |
            tracker-db-v1-

      - name: Restore previous Pages snapshot
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: |
          mkdir -p /tmp/tracker
          if curl -fsSL "$PAGES_URL" -o /tmp/tracker/previous-data.json; then
            echo "Restored live Pages snapshot"
          else
            cp docs/data.json /tmp/tracker/previous-data.json
            echo "Using committed docs/data.json as previous snapshot"
          fi

      - name: Scan watchlist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_DELAY_SECONDS: "2"
        run: |
          python -m scripts.scan \
            --watchlist watchlist.json \
            --previous /tmp/tracker/previous-data.json \
            --output docs/data.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
