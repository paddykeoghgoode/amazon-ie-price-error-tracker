name: Scan and publish tracker

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      crawl_section:
        description: "Bestseller section (rotate = one section per run, all = full crawl with publish after each section)"
        type: choice
        default: rotate
        options:
          - rotate
          - all
          - gaming
          - home
          - lifestyle
          - general
  push:
    branches: [main]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

permissions:
  contents: read
  issues: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore watchlist history
        uses: actions/cache@v6
        with:
          path: data/tracker.db
          key: tracker-db-v1-${{ github.run_id }}
          restore-keys: |
            tracker-db-v1-

      - name: Fetch the published snapshot
        run: |
          mkdir -p site
          curl -fsSL "$PAGES_URL/data.json?t=$(date +%s)" -o site/previous-data.json \
            || cp docs/data.json site/previous-data.json

      - name: Scan watchlist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_DELAY_SECONDS: "2"
        run: |
          python -m scripts.scan \
            --watchlist watchlist.json \
            --previous site/previous-data.json \
            --output site/data.json

      - name: Stage watchlist artifact
        run: cp site/data.json watchlist-data.json

      - uses: actions/upload-artifact@v7
        with:
          name: watchlist-data
          path: watchlist-data.json
          retention-days: 1

  publish-watchlist:
    needs: watchlist
    if: ${{ needs.watchlist.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: watchlist-data
          path: incoming

      - name: Assemble site after watchlist scan
        run: |
          mkdir -p docs
          cp incoming/watchlist-data.json docs/data.json
          curl -fsSL "$PAGES_URL/deals.json?t=$(date +%s)" -o docs/deals.json || true
          test -s docs/deals.json || echo '{}' > docs/deals.json
          ls -la docs

      - id: deployment
        uses: ./.github/actions/deploy-tracker-site

  bestsellers:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.crawl_section != 'all'
      ) ||
      github.event_name == 'push' ||
      github.event_name == 'issues' ||
      (github.event_name == 'schedule' && !github.event.repository.private)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore bestseller price history
        uses: actions/cache@v6
        with:
          path: data/bestsellers.db
          key: bestsellers-db-v1-${{ github.run_id }}
          restore-keys: |
            bestsellers-db-v1-

      - name: Choose bestseller section
        id: crawl-section
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.crawl_section }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=rotate" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch published deals for merge
        run: |
          mkdir -p site
          curl -fsSL "$PAGES_URL/deals.json?t=$(date +%s)" -o site/previous-deals.json || echo '{}' > site/previous-deals.json

      - name: Crawl bestseller section
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python -m scripts.crawl_bestsellers \
            --config bestsellers.json \
            --section "${{ steps.crawl-section.outputs.id }}" \
            --run-number "${{ github.run_number }}" \
            --merge-previous site/previous-deals.json \
            --output site/deals.json

      - name: Stage bestsellers artifact
        run: cp site/deals.json bestsellers-data.json

      - uses: actions/upload-artifact@v7
        with:
          name: bestsellers-data
          path: bestsellers-data.json
          retention-days: 1

  publish-bestsellers:
    needs: bestsellers
    if: ${{ needs.bestsellers.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bestsellers-data
          path: incoming

      - name: Assemble site after bestseller scan
        run: |
          mkdir -p docs
          cp incoming/bestsellers-data.json docs/deals.json
          curl -fsSL "$PAGES_URL/data.json?t=$(date +%s)" -o docs/data.json.new \
            && mv docs/data.json.new docs/data.json || true
          ls -la docs

      - id: deployment
        uses: ./.github/actions/deploy-tracker-site

  bestsellers-all:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.crawl_section == 'all'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        section: [gaming, home, lifestyle, general]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore bestseller price history
        uses: actions/cache@v6
        with:
          path: data/bestsellers.db
          key: bestsellers-db-v1-${{ github.run_id }}
          restore-keys: |
            bestsellers-db-v1-

      - name: Fetch published deals for merge
        run: |
          mkdir -p site
          curl -fsSL "$PAGES_URL/deals.json?t=$(date +%s)" -o site/previous-deals.json || echo '{}' > site/previous-deals.json

      - name: Crawl section and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: |
          EXTRA=""
          if [ "${{ matrix.section }}" != "general" ]; then
            EXTRA="--skip-health"
          fi
          python -m scripts.crawl_bestsellers \
            --config bestsellers.json \
            --section "${{ matrix.section }}" \
            --merge-previous site/previous-deals.json \
            --output site/deals.json \
            $EXTRA

      - name: Assemble site after section scan
        run: |
          cp site/deals.json docs/deals.json
          curl -fsSL "$PAGES_URL/data.json?t=$(date +%s)" -o docs/data.json || true
          ls -la docs

      - id: deployment
        uses: ./.github/actions/deploy-tracker-site
