name: Watch Amazon.ie product
description: Add a listing to the GitHub Pages price-error tracker
title: "Watch: "
labels: ["watch"]
body:
  - type: markdown
    attributes:
      value: |
        Paste an Amazon.ie product URL, amzn.eu short link, or 10-character ASIN.
        Submit this issue once. The tracker resolves supported short links, checks the listing on the next watchlist scan, and shows the result on the Watchlist tab.
        GitHub issues are the submission method because GitHub Pages cannot write directly to the repository.
  - type: input
    id: url
    attributes:
      label: Amazon.ie URL or ASIN
      placeholder: https://www.amazon.ie/dp/B0XXXXXXXX
    validations:
      required: true
