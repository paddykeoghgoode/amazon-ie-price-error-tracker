name: Deploy tracker site to GitHub Pages
description: Upload the docs/ folder and deploy via GitHub Pages
outputs:
  page_url:
    description: URL of the deployed GitHub Pages site
    value: ${{ steps.deployment.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Check whether GitHub Pages is enabled
      id: pages-check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::GitHub Pages is not enabled; skipping deploy."
        fi

    - name: Configure Pages
      if: steps.pages-check.outputs.enabled == 'true'
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      if: steps.pages-check.outputs.enabled == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs

    - name: Deploy to GitHub Pages
      id: deployment
      if: steps.pages-check.outputs.enabled == 'true'
      uses: actions/deploy-pages@v5
